<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>solarSim roof tracer</title>
  <link rel="stylesheet" href="leaflet.css" />
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden !important; background: #0e0e10;
      overscroll-behavior: none; touch-action: none;
    }
    #map {
      position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0;
    }
    .leaflet-container {
      width: 100% !important; height: 100% !important;
      background: #0e0e10;
      font: 13px "Segoe UI Variable Text", "Segoe UI", sans-serif;
      cursor: crosshair;
    }
    .leaflet-container.leaflet-drag-target,
    .leaflet-container.leaflet-dragging {
      cursor: default;
    }
    .leaflet-grab { cursor: crosshair; }
    .leaflet-dragging .leaflet-grab { cursor: default; }
    .leaflet-tile { border: none; outline: none; }
    /* Leaflet hides tiles until loaded — that is the black flash on zoom. */
    .leaflet-container .leaflet-tile { visibility: visible !important; }
    .leaflet-control-attribution { display: none !important; }
    .leaflet-control-zoom {
      border: 1px solid #3f3f46 !important;
      border-radius: 10px !important;
      overflow: hidden;
      margin: 0 12px 12px 0 !important;
      box-shadow: none !important;
    }
    .leaflet-control-zoom a {
      background: rgba(24,24,27,0.94) !important;
      color: #e4e4e7 !important;
      border-bottom-color: #3f3f46 !important;
      width: 32px !important; height: 32px !important;
      line-height: 32px !important;
      font-size: 16px !important;
    }
    .leaflet-control-zoom a:hover { background: #27272a !important; color: #fff !important; }
    .tutorial {
      position: absolute; inset: 0; z-index: 2000;
      display: none; align-items: center; justify-content: center;
      background: rgba(9,9,11,0.55);
      font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif;
    }
    .tutorial.show { display: flex; }
    .tutorial-card {
      width: min(340px, calc(100% - 32px));
      background: #18181b; border: 1px solid #27272a; border-radius: 16px;
      padding: 18px 18px 16px; color: #fafafa;
      box-shadow: 0 18px 50px rgba(0,0,0,0.45);
    }
    .tutorial-demo {
      height: 140px; border-radius: 12px; background: #0c0c0e;
      border: 1px solid #27272a; margin-bottom: 14px; overflow: hidden;
      position: relative;
    }
    .tutorial-kicker {
      margin: 0 0 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; color: #2dd4bf;
    }
    .tutorial-card h2 {
      margin: 0 0 6px; font-size: 18px; font-weight: 600;
      font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif;
    }
    .tutorial-card p {
      margin: 0 0 14px; font-size: 13px; line-height: 1.45; color: #a1a1aa;
    }
    .tutorial-card button {
      width: 100%; height: 36px; border: 0; border-radius: 10px;
      background: #2dd4bf; color: #042f2e; font-weight: 600; font-size: 13px;
      cursor: pointer;
    }
    .tutorial-card button:hover { background: #5eead4; }
    .demo-fill {
      fill: #22c55e; stroke: none; opacity: 0;
      animation: fillRoof 7s ease-in-out infinite;
    }
    .demo-roof {
      fill: none; stroke: #2dd4bf; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round;
      stroke-dasharray: 100; stroke-dashoffset: 100;
      animation: drawRoof 7s ease-in-out infinite;
    }
    .demo-dot { fill: #2dd4bf; opacity: 0; }
    .demo-dot.d1 { animation: popDotFirst 7s ease-in-out infinite; }
    .demo-dot.d2 { animation: popDot 7s ease-in-out infinite 0.7s; }
    .demo-dot.d3 { animation: popDot 7s ease-in-out infinite 1.4s; }
    .demo-dot.d4 { animation: popDot 7s ease-in-out infinite 2.1s; }
    .demo-dot.d5 { animation: popDot 7s ease-in-out infinite 2.8s; }
    .demo-close {
      fill: #22c55e; stroke: #fff; stroke-width: 1.5;
      opacity: 0; transform-box: fill-box; transform-origin: center;
      animation: showClose 7s ease-in-out infinite;
    }
    .demo-close-ring {
      fill: none; stroke: #22c55e; stroke-width: 2;
      opacity: 0; transform-box: fill-box; transform-origin: center;
      animation: pulseClose 7s ease-in-out infinite;
    }
    .demo-cursor {
      fill: #fafafa; stroke: #18181b; stroke-width: 1;
      transform-box: fill-box; transform-origin: 0 0;
      animation: moveCursor 7s ease-in-out infinite;
    }
    @keyframes drawRoof {
      0%, 10% { stroke-dashoffset: 100; }
      20% { stroke-dashoffset: 79; }
      30% { stroke-dashoffset: 58; }
      40% { stroke-dashoffset: 45; }
      52% { stroke-dashoffset: 13; }
      64%, 86% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 100; }
    }
    @keyframes fillRoof {
      0%, 62% { opacity: 0; }
      68%, 86% { opacity: 0.22; }
      100% { opacity: 0; }
    }
    @keyframes popDot {
      0%, 6% { opacity: 0; }
      12%, 86% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes popDotFirst {
      0%, 6% { opacity: 0; }
      12%, 56% { opacity: 1; }
      60%, 86% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes showClose {
      0%, 56% { opacity: 0; transform: scale(0.7); }
      62%, 86% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.7); }
    }
    @keyframes pulseClose {
      0%, 56% { opacity: 0; transform: scale(0.8); }
      62% { opacity: 1; transform: scale(1); }
      70% { opacity: 0.4; transform: scale(1.6); }
      78%, 86% { opacity: 0.9; transform: scale(1.15); }
      100% { opacity: 0; transform: scale(0.8); }
    }
    @keyframes moveCursor {
      0%   { transform: translate(28px, 92px); }
      10%  { transform: translate(36px, 78px); }
      20%  { transform: translate(92px, 28px); }
      30%  { transform: translate(168px, 42px); }
      40%  { transform: translate(186px, 88px); }
      52%  { transform: translate(70px, 108px); }
      64%  { transform: translate(36px, 78px); }
      86%  { transform: translate(36px, 78px); }
      100% { transform: translate(28px, 92px); }
    }
    .edge-label {
      background: rgba(255,255,255,0.92); color: #1f2937;
      border: 1px solid #2DD4BF; border-radius: 8px;
      padding: 1px 5px; font: 600 11px "Segoe UI Variable Text", "Segoe UI", sans-serif;
      white-space: nowrap; box-shadow: 0 1px 2px rgba(0,0,0,0.25);
    }
    .corner-marker {
      width: 6px; height: 6px; margin-left: -3px; margin-top: -3px;
      border-radius: 50%; background: #2DD4BF; border: 1.5px solid #fff;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.35);
      cursor: default;
    }
    .corner-marker.first-closable {
      box-shadow: 0 0 0 2px #22c55e, 0 0 0 1px rgba(0,0,0,0.35);
      cursor: default;
    }
    .corner-marker:active { cursor: default; }
    .basemap-toggle {
      position: absolute; z-index: 1000; right: 12px; top: 12px;
      display: flex; gap: 4px; pointer-events: auto;
    }
    .basemap-toggle button {
      background: rgba(24,24,27,0.92); color: #e4e4e7; border: 1px solid #3f3f46;
      border-radius: 8px; padding: 6px 10px; font: 12px "Segoe UI Variable Text", "Segoe UI", sans-serif;
      cursor: default;
    }
    .basemap-toggle button.active {
      border-color: #2DD4BF; color: #5EEAD4;
    }
  </style>
  <script>
    try {
      Object.defineProperty(window, 'devicePixelRatio', {
        configurable: true, get: function () { return 1; }
      });
    } catch (e) { /* ignore */ }
  </script>
  <script src="leaflet.js"></script>
</head>
<body>
  <div id="map"></div>
  <div class="basemap-toggle">
    <button type="button" id="btnGoogle" class="active" title="Sharp satellite">Sharp</button>
    <button type="button" id="btnEsri" title="Esri imagery">Esri</button>
  </div>
  <div id="traceTutorial" class="tutorial" role="dialog" aria-label="Trace roof">
    <div class="tutorial-card">
      <div class="tutorial-demo">
        <svg viewBox="0 0 220 140" width="100%" height="140">
          <polygon class="demo-fill" points="36,78 92,28 168,42 186,88 70,108"/>
          <path class="demo-roof" pathLength="100" d="M36,78 L92,28 L168,42 L186,88 L70,108 Z"/>
          <circle class="demo-dot d1" cx="36" cy="78" r="4"/>
          <circle class="demo-dot d2" cx="92" cy="28" r="4"/>
          <circle class="demo-dot d3" cx="168" cy="42" r="4"/>
          <circle class="demo-dot d4" cx="186" cy="88" r="4"/>
          <circle class="demo-dot d5" cx="70" cy="108" r="4"/>
          <circle class="demo-close-ring" cx="36" cy="78" r="8"/>
          <circle class="demo-close" cx="36" cy="78" r="5"/>
          <polygon class="demo-cursor" points="0,0 0,16 4.5,12.5 8,20 10.5,19 7,11.5 12,11.5"/>
        </svg>
      </div>
      <p class="tutorial-kicker">How to trace</p>
      <h2>Click every corner</h2>
      <p>Search the address, zoom in, then click around the roof. The first point turns green when the outline can close — click it to finish, then import.</p>
      <button type="button" id="tutorialDismiss">Got it</button>
    </div>
  </div>
  <script>
    // Google sat tiles are sharp to ~z20. Esri often grays out / forces overzoom blur.
    const MIN_ZOOM = 2;
    const VISUAL_MAX = 21;
    const HOUSE_ZOOM = 19;
    const ESRI_NATIVE = 17;

    let map = null;
    let googleLayer = null;
    let esriLayer = null;
    let activeBasemap = 'google';

    // rings[i] = [{lat,lon}, ...] — any number of sides; closedFlags[i] = finished fill
    const rings = [[]];
    const closedFlags = [false];
    let activeRing = 0;
    const CLOSE_PX = 22;
    let polyLayers = [];
    let markers = [];
    let edgeLabels = [];
    let rubberLine = null;
    let rubberLabel = null;
    let closePreview = null;
    let dragging = false;
    let invalidateTimer = null;
    let lastSize = { w: 0, h: 0 };

    function post(msg) {
      try {
        if (window.chrome && chrome.webview && chrome.webview.postMessage)
          chrome.webview.postMessage(msg);
      } catch (e) { /* host not ready */ }
    }

    function metersPerPixel() {
      if (!map) return 0;
      const z = map.getZoom();
      const lat = map.getCenter().lat;
      return (156543.03392804097 / Math.pow(2, z)) * Math.cos(lat * Math.PI / 180);
    }

    // Haversine edge length (m) — matches survey-style Google measure closely enough for design aid.
    function haversineM(a, b) {
      const R = 6371000;
      const toRad = Math.PI / 180;
      const dLat = (b.lat - a.lat) * toRad;
      const dLon = (b.lon - a.lon) * toRad;
      const la1 = a.lat * toRad;
      const la2 = b.lat * toRad;
      const h = Math.sin(dLat / 2) ** 2
        + Math.cos(la1) * Math.cos(la2) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
    }

    function ringMetrics(corners, closed) {
      if (!corners || corners.length < 2) {
        return { edges: [], area: 0, perimeter: 0 };
      }
      const edges = [];
      const n = corners.length;
      // Open trace: only real clicked sides. Closed: include last→first.
      const edgeCount = closed ? n : Math.max(0, n - 1);
      for (var e = 0; e < edgeCount; e++) {
        edges.push(haversineM(corners[e], corners[(e + 1) % n]));
      }
      var perimeter = edges.reduce(function (s, x) { return s + x; }, 0);
      var area = 0;
      if (n >= 3) {
        const lat0 = corners.reduce(function (s, c) { return s + c.lat; }, 0) / n;
        const lon0 = corners.reduce(function (s, c) { return s + c.lon; }, 0) / n;
        const cos = Math.cos(lat0 * Math.PI / 180);
        const mPerDegLat = 111320;
        const mPerDegLon = 111320 * cos;
        var sum = 0;
        for (var j = 0; j < n; j++) {
          const p = corners[j];
          const q = corners[(j + 1) % n];
          const x1 = (p.lon - lon0) * mPerDegLon;
          const y1 = (p.lat - lat0) * mPerDegLat;
          const x2 = (q.lon - lon0) * mPerDegLon;
          const y2 = (q.lat - lat0) * mPerDegLat;
          sum += x1 * y2 - x2 * y1;
        }
        area = Math.abs(sum) * 0.5;
      }
      return { edges: edges, area: area, perimeter: perimeter };
    }

    function isClosed(i) {
      return !!closedFlags[i];
    }

    function allImportableRings() {
      return rings.filter(function (r) { return r.length >= 3; });
    }

    function nearFirstCorner(latlng, corners) {
      if (!map || !corners || corners.length < 3) return false;
      const p = map.latLngToContainerPoint(latlng);
      const f = map.latLngToContainerPoint([corners[0].lat, corners[0].lon]);
      const dx = p.x - f.x;
      const dy = p.y - f.y;
      return (dx * dx + dy * dy) <= CLOSE_PX * CLOSE_PX;
    }

    // Corner handles shrink as you zoom in so roof edges stay visible under the tip.
    function cornerMarkerPx() {
      if (!map) return 6;
      const z = map.getZoom();
      if (z >= 20) return 4;
      if (z >= 19) return 5;
      if (z >= 17) return 6;
      return 7;
    }

    function updateScale() {
      const m = metersPerPixel();
      if (!m) return;
      post({ type: 'view', mPerPx: m, zoom: map ? map.getZoom() : 0 });
    }

    function updateMeasureHud() {
      /* Status lives in the app chrome, not on the map. */
    }

    function emitOutline() {
      const payloadRings = [];
      rings.forEach(function (r) {
        if (r.length >= 3) payloadRings.push(r.map(function (c) { return { lat: c.lat, lon: c.lon }; }));
      });

      const active = rings[activeRing];
      post({
        type: 'outline',
        rings: payloadRings,
        corners: payloadRings.length ? payloadRings[0] : [],
        mPerPx: metersPerPixel(),
        zoom: map ? map.getZoom() : 0,
        canNewSection: !!(active && active.length >= 3),
        canFinish: !!(active && active.length >= 3 && !isClosed(activeRing)),
        activeClosed: isClosed(activeRing),
        activeCorners: active ? active.length : 0,
      });
      updateMeasureHud();
    }

    function clearGraphics() {
      polyLayers.forEach(function (l) { map.removeLayer(l); });
      polyLayers = [];
      markers.forEach(function (m) { map.removeLayer(m); });
      markers = [];
      edgeLabels.forEach(function (l) { map.removeLayer(l); });
      edgeLabels = [];
      if (rubberLine) { map.removeLayer(rubberLine); rubberLine = null; }
      if (rubberLabel) { map.removeLayer(rubberLabel); rubberLabel = null; }
      if (closePreview) { map.removeLayer(closePreview); closePreview = null; }
    }

    function addEdgeLabel(a, b, text) {
      const mid = L.latLng((a.lat + b.lat) / 2, (a.lon + b.lon) / 2);
      const icon = L.divIcon({
        className: '',
        html: '<div class="edge-label">' + text + '</div>',
        iconSize: null,
      });
      const marker = L.marker(mid, { icon: icon, interactive: false, keyboard: false }).addTo(map);
      edgeLabels.push(marker);
    }

    function rebuildGraphics() {
      if (!map) return;
      clearGraphics();

      rings.forEach(function (corners, ringIndex) {
        if (!corners.length) return;
        const latlngs = corners.map(function (c) { return [c.lat, c.lon]; });
        const isActive = ringIndex === activeRing;
        const closed = isClosed(ringIndex);
        const color = isActive ? '#f59e0b' : '#fbbf24';
        const m = ringMetrics(corners, closed);

        if (closed && corners.length >= 3) {
          // Finished section only — filled closed polygon
          polyLayers.push(L.polygon(latlngs, {
            color: color, weight: isActive ? 2.5 : 1.75,
            fillColor: color, fillOpacity: isActive ? 0.22 : 0.12,
            interactive: false,
          }).addTo(map));
          for (var i = 0; i < corners.length; i++) {
            addEdgeLabel(corners[i], corners[(i + 1) % corners.length], m.edges[i].toFixed(2) + ' m');
          }
        } else if (corners.length >= 2) {
          // Open trace — polyline only (no auto 4th / closing side)
          polyLayers.push(L.polyline(latlngs, {
            color: color, weight: isActive ? 2.5 : 1.75, interactive: false,
          }).addTo(map));
          for (var j = 0; j < corners.length - 1; j++) {
            addEdgeLabel(corners[j], corners[j + 1], m.edges[j].toFixed(2) + ' m');
          }
        }

        corners.forEach(function (c, idx) {
          if (!isActive) {
            markers.push(L.circleMarker([c.lat, c.lon], {
              radius: Math.max(2, cornerMarkerPx() / 2),
              color: '#fff', weight: 1,
              fillColor: color, fillOpacity: 0.9, interactive: false,
            }).addTo(map));
            return;
          }

          const canClose = !closed && idx === 0 && corners.length >= 3;
          const sz = cornerMarkerPx();
          const half = sz / 2;
          const cls = canClose ? 'corner-marker first-closable' : 'corner-marker';
          const icon = L.divIcon({
            className: 'corner-icon',
            html: '<div class="' + cls + '" style="width:' + sz + 'px;height:' + sz + 'px;margin-left:-' + half + 'px;margin-top:-' + half + 'px;" title="' + (canClose ? 'Click to close outline' : '') + '"></div>',
            iconSize: [sz, sz],
            iconAnchor: [half, half],
          });
          const mk = L.marker([c.lat, c.lon], {
            icon: icon, draggable: true, autoPan: true, keyboard: false,
          }).addTo(map);
          if (mk.getElement()) mk.getElement().style.cursor = 'default';
          mk.on('dragstart', function () { dragging = true; map.dragging.disable(); });
          mk.on('drag', function (ev) {
            const ll = ev.target.getLatLng();
            corners[idx] = { lat: ll.lat, lon: ll.lng };
            closedFlags[ringIndex] = false;
            refreshActiveGeometryOnly();
          });
          mk.on('dragend', function (ev) {
            const ll = ev.target.getLatLng();
            corners[idx] = { lat: ll.lat, lon: ll.lng };
            dragging = false;
            map.dragging.enable();
            rebuildGraphics();
          });
          if (canClose) {
            mk.on('click', function (ev) {
              L.DomEvent.stopPropagation(ev);
              finishActiveRing();
            });
          }
          markers.push(mk);
        });
      });

      emitOutline();
    }

    function refreshActiveGeometryOnly() {
      emitOutline();
    }

    function pushCorner(lat, lon) {
      if (!rings[activeRing]) rings[activeRing] = [];
      // Adding another corner re-opens if it was closed
      closedFlags[activeRing] = false;
      rings[activeRing].push({ lat: lat, lon: lon });
      rebuildGraphics();
    }

    function finishActiveRing() {
      const active = rings[activeRing];
      if (!active || active.length < 3) return false;
      closedFlags[activeRing] = true;
      rebuildGraphics();
      return true;
    }

    function undoCorner() {
      const active = rings[activeRing];
      if (active && isClosed(activeRing)) {
        closedFlags[activeRing] = false;
        rebuildGraphics();
        return;
      }
      if (active && active.length > 0) {
        active.pop();
        closedFlags[activeRing] = false;
        rebuildGraphics();
        return;
      }
      if (activeRing > 0) {
        rings.pop();
        closedFlags.pop();
        activeRing -= 1;
        closedFlags[activeRing] = false;
        const prev = rings[activeRing];
        if (prev && prev.length) prev.pop();
        rebuildGraphics();
      }
    }

    function clearAll() {
      rings.length = 0;
      closedFlags.length = 0;
      rings.push([]);
      closedFlags.push(false);
      activeRing = 0;
      rebuildGraphics();
    }

    function newSection() {
      const active = rings[activeRing];
      if (!active || active.length < 3) return false;
      closedFlags[activeRing] = true;
      rings.push([]);
      closedFlags.push(false);
      activeRing = rings.length - 1;
      rebuildGraphics();
      return true;
    }

    function onMapClick(e) {
      if (dragging) return;
      const active = rings[activeRing] || [];
      // Explicit close only — click near / on first corner (any side count ≥ 3)
      if (active.length >= 3 && !isClosed(activeRing) && nearFirstCorner(e.latlng, active)) {
        finishActiveRing();
        return;
      }
      pushCorner(e.latlng.lat, e.latlng.lng);
    }

    function onMapMouseMove(e) {
      const active = rings[activeRing];
      if (!active || active.length === 0 || dragging || isClosed(activeRing)) {
        if (rubberLine) { map.removeLayer(rubberLine); rubberLine = null; }
        if (rubberLabel) { map.removeLayer(rubberLabel); rubberLabel = null; }
        if (closePreview) { map.removeLayer(closePreview); closePreview = null; }
        return;
      }
      const last = active[active.length - 1];
      const cur = { lat: e.latlng.lat, lon: e.latlng.lng };
      const closing = active.length >= 3 && nearFirstCorner(e.latlng, active);
      const dist = closing
        ? haversineM(last, active[0])
        : haversineM(last, cur);
      const end = closing ? active[0] : cur;

      if (!rubberLine) {
        rubberLine = L.polyline([[last.lat, last.lon], [end.lat, end.lon]], {
          color: closing ? '#22c55e' : '#f59e0b',
          weight: 2, dashArray: '6 4', interactive: false,
        }).addTo(map);
      } else {
        rubberLine.setLatLngs([[last.lat, last.lon], [end.lat, end.lon]]);
        rubberLine.setStyle({ color: closing ? '#22c55e' : '#f59e0b' });
      }

      if (closePreview) { map.removeLayer(closePreview); closePreview = null; }
      if (closing) {
        closePreview = L.polygon(
          active.map(function (c) { return [c.lat, c.lon]; }),
          {
            color: '#22c55e', weight: 1.5, dashArray: '4 6',
            fillColor: '#22c55e', fillOpacity: 0.08, interactive: false,
          }
        ).addTo(map);
      }

      const mid = L.latLng((last.lat + end.lat) / 2, (last.lon + end.lon) / 2);
      const labelHtml = '<div class="edge-label">'
        + (closing ? 'Close · ' : '')
        + dist.toFixed(2) + ' m</div>';
      if (!rubberLabel) {
        rubberLabel = L.marker(mid, {
          icon: L.divIcon({ className: '', html: labelHtml, iconSize: null }),
          interactive: false, keyboard: false,
        }).addTo(map);
      } else {
        rubberLabel.setLatLng(mid);
        rubberLabel.setIcon(L.divIcon({ className: '', html: labelHtml, iconSize: null }));
      }
    }

    function setBasemap(name) {
      activeBasemap = name;
      if (!map) return;
      if (name === 'google') {
        if (!map.hasLayer(googleLayer)) map.addLayer(googleLayer);
        if (map.hasLayer(esriLayer)) map.removeLayer(esriLayer);
      } else {
        if (!map.hasLayer(esriLayer)) map.addLayer(esriLayer);
        if (map.hasLayer(googleLayer)) map.removeLayer(googleLayer);
      }
      document.getElementById('btnGoogle').classList.toggle('active', name === 'google');
      document.getElementById('btnEsri').classList.toggle('active', name === 'esri');
    }

    function scheduleInvalidate() {
      if (!map) return;
      if (invalidateTimer) clearTimeout(invalidateTimer);
      invalidateTimer = setTimeout(function () {
        invalidateTimer = null;
        const el = map.getContainer();
        const w = el.clientWidth, h = el.clientHeight;
        if (w < 40 || h < 40) return;
        lastSize = { w: w, h: h };
        map.invalidateSize(false);
        updateScale();
      }, 60);
    }

    function startMap() {
      const el = document.getElementById('map');
      if (!el || el.clientWidth < 100 || el.clientHeight < 100) {
        requestAnimationFrame(startMap);
        return;
      }
      if (map) { scheduleInvalidate(); return; }

      map = L.map(el, {
        crs: L.CRS.EPSG3857,
        zoomControl: true,
        attributionControl: false,
        doubleClickZoom: false,
        boxZoom: false,
        zoomSnap: 1,
        zoomDelta: 1,
        wheelPxPerZoomLevel: 80,
        fadeAnimation: false,
        zoomAnimation: true,
        markerZoomAnimation: true,
        trackResize: true,
        maxBounds: [[-85, -180], [85, 180]],
        maxBoundsViscosity: 0.8,
      }).setView([-25.2744, 133.7751], 4);
      map.zoomControl.setPosition('bottomright');

      googleLayer = L.tileLayer(
        'https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
        {
          subdomains: ['0', '1', '2', '3'],
          minZoom: MIN_ZOOM,
          maxZoom: VISUAL_MAX,
          maxNativeZoom: 20,
          detectRetina: false,
          updateWhenZooming: true,
          updateWhenIdle: true,
          keepBuffer: 8,
        }
      );

      esriLayer = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        {
          minZoom: MIN_ZOOM,
          maxZoom: VISUAL_MAX,
          maxNativeZoom: ESRI_NATIVE,
          detectRetina: false,
          updateWhenZooming: true,
          updateWhenIdle: true,
          keepBuffer: 8,
        }
      );

      googleLayer.addTo(map);
      map.setMinZoom(MIN_ZOOM);
      map.setMaxZoom(VISUAL_MAX);

      map.on('click', onMapClick);
      map.on('mousemove', onMapMouseMove);
      map.on('zoomend', function () {
        updateScale();
        if (!dragging) rebuildGraphics();
        post({ type: 'view', mPerPx: metersPerPixel(), zoom: map.getZoom() });
      });
      map.on('moveend', function () {
        updateScale();
        post({ type: 'view', mPerPx: metersPerPixel(), zoom: map.getZoom() });
      });

      document.getElementById('btnGoogle').onclick = function () { setBasemap('google'); };
      document.getElementById('btnEsri').onclick = function () { setBasemap('esri'); };

      document.addEventListener('keydown', function (ev) {
        if ((ev.ctrlKey || ev.metaKey) && (ev.key === 'z' || ev.key === 'Z')) {
          ev.preventDefault();
          undoCorner();
        }
      });

      scheduleInvalidate();
      setTimeout(scheduleInvalidate, 120);
      setTimeout(scheduleInvalidate, 400);
      updateScale();
      updateMeasureHud();
      post({ type: 'ready' });
    }

    window.solarSimMap = {
      flyTo: function (lat, lon, zoom) {
        if (!map) return;
        var z = typeof zoom === 'number' ? zoom : HOUSE_ZOOM;
        z = Math.max(MIN_ZOOM, Math.min(VISUAL_MAX, Math.round(z)));
        map.setView([lat, lon], z, { animate: false });
        scheduleInvalidate();
      },
      undoCorner: function () { undoCorner(); },
      clearOutline: function () { clearAll(); },
      newSection: function () { return newSection(); },
      finishOutline: function () { return finishActiveRing(); },
      getCorners: function () {
        const active = rings[activeRing] || [];
        return active.slice();
      },
      invalidate: function () { scheduleInvalidate(); },
      showTutorial: function () {
        var el = document.getElementById('traceTutorial');
        if (el) el.classList.add('show');
      },
      hideTutorial: function () {
        var el = document.getElementById('traceTutorial');
        if (el) el.classList.remove('show');
      }
    };

    document.getElementById('tutorialDismiss').onclick = function () {
      window.solarSimMap.hideTutorial();
      post({ type: 'tutorial-dismissed' });
    };
    document.getElementById('traceTutorial').addEventListener('click', function (ev) {
      if (ev.target.id === 'traceTutorial') {
        window.solarSimMap.hideTutorial();
        post({ type: 'tutorial-dismissed' });
      }
    });

    if (window.ResizeObserver) {
      new ResizeObserver(function () { scheduleInvalidate(); })
        .observe(document.getElementById('map'));
    }
    window.addEventListener('resize', function () { scheduleInvalidate(); });
    startMap();
  </script>
</body>
</html>
