name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0). Leave empty to use csproj Version."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $version = $null
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -match '^v(.+)$') {
            $version = $Matches[1]
          }
          $input = "${{ github.event.inputs.version }}".Trim()
          if (-not $version -and $input) {
            $version = $input.TrimStart('v')
          }
          if (-not $version) {
            [xml]$proj = Get-Content "src/SolarSim.Preview/SolarSim.Preview.csproj"
            $version = @($proj.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          }
          if (-not $version) { throw "Could not resolve version." }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Publishing version $version"

      - name: Validate XAML resources
        shell: pwsh
        run: ./Tools/Validate-XamlResources.ps1

      - name: Test
        run: dotnet test --configuration Release --nologo

      - name: Publish Windows x64
        shell: pwsh
        run: |
          ./Tools/Publish-Windows.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: solarSim-${{ steps.ver.outputs.version }}-win-x64
          path: artifacts/publish/solarSim-${{ steps.ver.outputs.version }}-win-x64.zip

    outputs:
      version: ${{ steps.ver.outputs.version }}

  publish-macos:
    runs-on: macos-latest
    needs: publish-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish macOS arm64
        run: pwsh ./Tools/Publish-Mac.ps1 -Version "${{ needs.publish-windows.outputs.version }}" -Runtime osx-arm64

      - name: Publish macOS x64
        run: pwsh ./Tools/Publish-Mac.ps1 -Version "${{ needs.publish-windows.outputs.version }}" -Runtime osx-x64

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solarSim-${{ needs.publish-windows.outputs.version }}-macos
          path: |
            artifacts/publish/solarSim-${{ needs.publish-windows.outputs.version }}-osx-arm64.dmg
            artifacts/publish/solarSim-${{ needs.publish-windows.outputs.version }}-osx-x64.dmg

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [publish-windows, publish-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten installers
        run: |
          mkdir -p release-files
          find dist \( -name '*.zip' -o -name '*.dmg' \) -exec cp {} release-files/ \;
          ls -la release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: solarSim ${{ needs.publish-windows.outputs.version }}
          body: |
            ## solarSim ${{ needs.publish-windows.outputs.version }}

            Public beta — design aid only (not stamped approval).

            ### Windows (full editor)
            1. Download `solarSim-${{ needs.publish-windows.outputs.version }}-win-x64.zip`
            2. Unzip and run `solarSim.exe`
            3. Install [WebView2](https://developer.microsoft.com/microsoft-edge/webview2/) if map tracer fails

            ### macOS (preview)
            - **Apple Silicon:** `solarSim-${{ needs.publish-windows.outputs.version }}-osx-arm64.dmg`
            - **Intel:** `solarSim-${{ needs.publish-windows.outputs.version }}-osx-x64.dmg`
            1. Open the DMG and drag `solarSim` into Applications
            2. First launch: right-click → **Open** (unsigned beta)
            3. Same `.solarproj` files as Windows. Map tracing is still Windows-only.

            See `SMOKE.md`, `RELEASE.md`, `CHANGELOG.md`.
          files: release-files/*
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
